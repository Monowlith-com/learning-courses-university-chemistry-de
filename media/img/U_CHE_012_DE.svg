<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img"><title>Dipoladdition</title><desc>Entgegengesetzte Dipole im linearen Modell kompensieren sich; im gewinkelten Modell bleibt eine Resultierende.</desc><rect width="960" height="600" fill="#fff"/><g font-family="Arial,sans-serif" font-size="22" fill="#263238"><text x="480" y="45" text-anchor="middle" font-size="29" font-weight="bold">Dipoladdition</text><path d="M40 66H920" stroke="#c1c7ca"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#2166a5"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#b44c2c"/></marker></defs><path d="M480 105V520" stroke="#d9dfe1"/><circle cx="240" cy="320" r="9" fill="#263238"/><circle cx="720" cy="350" r="9" fill="#263238"/><g stroke="#2166a5" stroke-width="5" fill="none" marker-end="url(#a)"><path d="M240 320H80"/><path d="M240 320H400"/><path d="M720 350L593 252"/><path d="M720 350L847 252"/></g><path d="M720 350V154" stroke="#b44c2c" stroke-width="5" marker-end="url(#b)"/><text x="240" y="390" text-anchor="middle">μ = 0</text><text x="720" y="130" text-anchor="middle" fill="#b44c2c">μ ≠ 0</text><text x="240" y="480" text-anchor="middle">Linear</text><text x="720" y="480" text-anchor="middle">Gewinkelt</text></g></svg>
