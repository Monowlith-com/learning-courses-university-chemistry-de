<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img"><title>Modell eines Katalysezyklus</title><desc>Katalysator C bindet S zu CS, wandelt CS in CP um und setzt P frei; C wird regeneriert.</desc><rect width="960" height="600" fill="#fff"/><g font-family="Arial,sans-serif" font-size="23" fill="#263238"><text x="480" y="48" text-anchor="middle" font-size="29" font-weight="bold">Modell eines Katalysezyklus</text><path d="M40 68H920" stroke="#c1c7ca"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#2166a5"/></marker></defs><g fill="none" stroke="#2166a5" stroke-width="4" marker-start="url(#a)" marker-end="url(#a)"><path d="M527 170L690 359"/><path d="M650 409H310"/><path d="M270 359L433 170"/></g><circle cx="480" cy="135" r="56" fill="#e5f1fa" stroke="#2166a5" stroke-width="2"/><text x="480" y="144" text-anchor="middle" font-size="31">C</text><circle cx="720" cy="410" r="56" fill="#e5f1fa" stroke="#2166a5" stroke-width="2"/><text x="720" y="419" text-anchor="middle" font-size="31">CS</text><circle cx="240" cy="410" r="56" fill="#e5f1fa" stroke="#2166a5" stroke-width="2"/><text x="240" y="419" text-anchor="middle" font-size="31">CP</text><text x="690" y="230" text-anchor="middle">S bindet</text><text x="270" y="230" text-anchor="middle">P wird frei</text><text x="480" y="458" text-anchor="middle">Umwandlung</text><text x="480" y="560" text-anchor="middle">S ⇌ P</text></g></svg>
