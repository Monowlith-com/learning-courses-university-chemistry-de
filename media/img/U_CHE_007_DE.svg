<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img"><title>Brechung an einer Grenzfläche</title><desc>Ein Lichtstrahl wird beim Übergang von Luft zu Glas zum Lot gebrochen.</desc><rect width="800" height="450" fill="white"/><g font-family="Arial,sans-serif" font-size="20" fill="#17283a"><text x="400" y="38" text-anchor="middle" font-size="25" font-weight="bold">Brechung an einer Grenzfläche</text><rect x="80" y="224" width="640" height="170" fill="#e1f0f7"/><path d="M80 224H720" stroke="#23384b" stroke-width="3"/><path d="M400 70V390" stroke="#526779" stroke-dasharray="8 6" stroke-width="2"/><path d="M260 84L400 224L484 382" stroke="#1871a8" fill="none" stroke-width="5"/><path d="M400 164 A60 60 0 0 0 357.57 181.57 M400 284 A60 60 0 0 0 428.17 276.97" fill="none" stroke="#23384b" stroke-width="2"/><text x="330" y="155">45°</text><text x="435" y="300">28°</text><text x="95" y="100">Luft (n ≈ 1)</text><text x="95" y="260">Glas (n = 1.50)</text><text x="410" y="75">Lot</text></g></svg>
